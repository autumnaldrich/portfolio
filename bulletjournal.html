<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bullet Journal — Autumn Aldrich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blueprint: #000000;
    --blueprint-deep: #000000;
    --line: #aed0ee;
    --line-dim: #6f92b8;
    --paper: #f3f0e6;
    --paper-dim: #e7e2d2;
    --ink: #16213d;
    --ink-dim: #4a5674;
    --gold: #ffc72c;
    --safety: #e6532c;
    --mono: 'Poppins', sans-serif;
    --sans: 'Poppins', sans-serif;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--blueprint);
    color:var(--paper);
    font-family:var(--sans);
    line-height:1.5;
    overflow-x:hidden;
  }

  a{ color:inherit; text-decoration:none; }

  ::selection{ background:var(--gold); color:var(--ink); }

  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }

  /* ---------- NAV ---------- */
  nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:flex-end;
    padding:18px 5vw;
    background:rgba(0,0,0,0.88);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(174,208,238,0.25);
  }
  .nav-links{ display:flex; gap:2.2rem; font-family:var(--mono); font-size:0.78rem; letter-spacing:0.08em; }
  .nav-links a{ color:var(--line-dim); transition:color 0.2s; position:relative; }
  .nav-links a:hover{ color:var(--gold); }

  @media (max-width:720px){
    .nav-links{ display:none; }
    .menu-toggle{ display:flex; }
  }

  .menu-toggle{
    display:none; flex-direction:column; justify-content:center; gap:5px;
    width:26px; height:20px; background:none; border:none; cursor:pointer; padding:0;
    position:relative; z-index:110;
  }
  .menu-toggle span{
    display:block; width:100%; height:2px; background:var(--paper);
    transition:transform 0.25s ease, opacity 0.25s ease;
  }
  .menu-toggle.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
  .menu-toggle.open span:nth-child(2){ opacity:0; }
  .menu-toggle.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

  .mobile-menu{
    position:fixed; top:0; right:0; height:100vh; width:min(72vw,300px);
    background:rgba(0,0,0,0.97); backdrop-filter:blur(6px);
    border-left:1px solid rgba(174,208,238,0.25);
    display:flex; flex-direction:column;
    padding:100px 0 40px;
    transform:translateX(100%);
    transition:transform 0.3s ease;
    z-index:105;
  }
  .mobile-menu.open{ transform:translateX(0); }
  .mobile-menu a{
    font-family:var(--mono); font-size:0.9rem; letter-spacing:0.08em;
    color:var(--paper); text-transform:uppercase;
    padding:18px 30px; border-bottom:1px solid rgba(174,208,238,0.15);
  }
  .mobile-menu a:hover{ color:var(--gold); }
  @media (min-width:721px){
    .mobile-menu{ display:none; }
  }

  /* ---------- SHEET FRAME ---------- */
  .sheet{
    position:relative;
    margin:0 auto;
    max-width:1200px;
    padding:60px 5vw 80px;
  }

  /* ---------- BANNER ---------- */
  .detail-banner{
    position:relative; overflow:hidden;
    min-height:48vh;
    display:flex; flex-direction:column; justify-content:center;
    padding-top:90px;
  }
  .detail-banner .hero-bg{
    position:absolute; inset:0; z-index:-1; overflow:hidden; background:#0a0a0a;
  }
  .detail-banner .hero-bg img{
    width:100%; height:100%; object-fit:cover;
    filter:brightness(0.7) saturate(0.9);
    opacity:0; transition:opacity 0.6s ease;
  }
  .detail-banner .hero-bg img.loaded{ opacity:1; }
  .detail-banner .hero-bg::after{
    content:''; position:absolute; inset:0;
    background:rgba(0,0,0,0.32);
  }
  .detail-banner-inner{
    max-width:1200px; margin:0 auto; width:100%;
    padding:0 5vw;
  }
  .detail-title{
    font-family:var(--sans); font-size:clamp(1.8rem, 4.5vw, 3rem); font-weight:800;
    letter-spacing:0.08em; line-height:1.15; text-transform:uppercase; color:var(--paper);
    text-align:center;
  }
  .detail-sub{
    font-family:var(--mono); font-size:0.78rem; letter-spacing:0.1em;
    color:var(--paper); text-transform:uppercase; text-align:center;
    margin-top:14px; opacity:0.75;
  }

  /* ---------- GALLERY ---------- */
  .gallery-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:4px;
  }
  @media (max-width:520px){
    .gallery-grid{ gap:2px; }
  }
  .gallery-item{
    display:block; aspect-ratio:1; overflow:hidden; background:var(--paper-dim);
    position:relative;
  }
  .gallery-item img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform 0.4s ease;
  }
  .gallery-item:hover img{ transform:scale(1.06); }
  .gallery-status{
    grid-column:1 / -1;
    font-family:var(--mono); font-size:0.85rem; letter-spacing:0.05em;
    color:var(--line-dim); text-align:center; padding:60px 20px;
  }

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.94);
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; transition:opacity 0.25s ease;
    padding:5vw;
  }
  .lightbox.open{ opacity:1; visibility:visible; }
  .lightbox img{
    max-width:100%; max-height:90vh; object-fit:contain;
    border-radius:2px; box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .lightbox-close{
    position:absolute; top:24px; right:5vw;
    font-family:var(--mono); font-size:0.85rem; letter-spacing:0.1em;
    color:var(--paper); text-transform:uppercase; cursor:pointer;
    background:none; border:1px solid rgba(243,240,230,0.4); border-radius:2px;
    padding:8px 16px;
  }
  .lightbox-close:hover{ border-color:var(--gold); color:var(--gold); }

  .reveal{ opacity:0; transform:translateY(24px); transition:opacity 0.7s ease, transform 0.7s ease; }
  .reveal.visible{ opacity:1; transform:translateY(0); }

</style>
</head>
<body>

<nav>
  <div class="nav-links">
    <a href="./#work">Engineering</a>
    <a href="./#art">Art &amp; Design</a>
    <a href="./#about">About</a>
    <a href="https://www.linkedin.com/in/autumnaldrich" target="_blank" rel="noopener">LinkedIn</a>
  </div>
  <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="./#work">Engineering</a>
  <a href="./#art">Art &amp; Design</a>
  <a href="./#about">About</a>
  <a href="https://www.linkedin.com/in/autumnaldrich" target="_blank" rel="noopener">LinkedIn</a>
</div>

<div class="detail-banner">
  <div class="hero-bg">
    <img id="bannerImg" src="" alt="" onload="this.classList.add('loaded')">
  </div>
  <div class="detail-banner-inner">
    <h1 class="detail-title">Bullet Journal</h1>
    <div class="detail-sub">Personal Project — Illustration &amp; Layout Design</div>
  </div>
</div>

<section class="sheet">
  <div class="gallery-grid reveal" id="galleryGrid">
    <p class="gallery-status">Loading photos…</p>
  </div>
</section>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">Close ✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
  // ---- scroll reveal ----
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); }
    });
  }, { threshold: 0.05 });
  revealEls.forEach(el => io.observe(el));

  // ---- mobile menu ----
  const menuToggle = document.getElementById('menuToggle');
  const mobileMenu = document.getElementById('mobileMenu');
  menuToggle.addEventListener('click', () => {
    const isOpen = mobileMenu.classList.toggle('open');
    menuToggle.classList.toggle('open', isOpen);
    menuToggle.setAttribute('aria-expanded', isOpen);
  });
  mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    mobileMenu.classList.remove('open');
    menuToggle.classList.remove('open');
    menuToggle.setAttribute('aria-expanded', 'false');
  }));

  // ---- lightbox ----
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  function openLightbox(src, alt){
    lightboxImg.src = src;
    lightboxImg.alt = alt;
    lightbox.classList.add('open');
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
  }
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });

  // ---- auto-loading gallery ----
  // Drop new photos into website_photos/bulletjournal/ in the repo and push —
  // this page pulls the current file list straight from GitHub, no code edits needed.
  const OWNER = 'autumnaldrich';
  const REPO = 'portfolio';
  const FOLDER_PATH = 'website_photos/bulletjournal';
  const IMAGE_EXT = /\.(jpe?g|png|gif|webp)$/i;

  async function loadGallery(){
    const grid = document.getElementById('galleryGrid');
    const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER_PATH}`;

    try{
      const res = await fetch(apiUrl);
      if(!res.ok) throw new Error('GitHub API request failed: ' + res.status);
      const files = await res.json();

      const images = files
        .filter(f => f.type === 'file' && IMAGE_EXT.test(f.name))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric:true }));

      if(images.length === 0){
        grid.innerHTML = '<p class="gallery-status">No photos yet — add some to website_photos/bulletjournal in the repo and they\'ll show up here.</p>';
        return;
      }

      grid.innerHTML = '';
      images.forEach(file => {
        const label = file.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
        const item = document.createElement('a');
        item.href = file.download_url;
        item.className = 'gallery-item';
        item.addEventListener('click', (e) => { e.preventDefault(); openLightbox(file.download_url, label); });

        const img = document.createElement('img');
        img.src = file.download_url;
        img.loading = 'lazy';
        img.alt = label;
        item.appendChild(img);
        grid.appendChild(item);
      });

      document.getElementById('bannerImg').src = images[0].download_url;

    } catch(err){
      console.error(err);
      grid.innerHTML = '<p class="gallery-status">Couldn\'t load the gallery right now — please check back later.</p>';
    }
  }

  loadGallery();
</script>

</body>
</html>
